[project]
name = "beryl-gamemode"
version = "1.0.8"
description = "A flexible wrapper script for use with Proton to improve performance"
readme = "README.md"
requires-python = ">=3.13"

[dependency-groups]
dev = [
  "prettier>=0.0.7",
  "pyright>=1.1.408",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.1",
  "radon>=6.0.1",
  "ruff>=0.15.1",
  "ty>=0.0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "--tb=short -v"
